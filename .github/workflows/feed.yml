name: Обновить фид Kaspi

on:
  schedule:
    - cron: "17 * * * *"   # каждый час в :17 (UTC)
  workflow_dispatch:        # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write

concurrency:
  group: kaspi-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Собрать фид
        run: python3 build_feed.py

      - name: Сохранить фид
        run: |
          git config user.name "kaspi-feed-bot"
          git config user.email "kaspi-feed-bot@users.noreply.github.com"
          git add kaspi_feed.xml
          git diff --cached --quiet && exit 0
          git commit -m "Обновление фида $(TZ=Asia/Almaty date '+%Y-%m-%d %H:%M')"
          git push
