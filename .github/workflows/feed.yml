name: Обновить фид Kaspi

on:
  schedule:
    - cron: "17,47 * * * *"   # каждые 30 минут: в :17 и :47 (UTC)
  workflow_dispatch:        # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write

concurrency:
  group: kaspi-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Собрать фид
        env:
          KASPI_TOKEN: ${{ secrets.KASPI_TOKEN }}
        run: python3 build_feed.py

      - name: Сохранить фид
        run: |
          git config user.name "kaspi-feed-bot"
          git config user.email "kaspi-feed-bot@users.noreply.github.com"
          git add kaspi_feed.xml
          [ -f pp7_stock.csv ] && git add pp7_stock.csv
          git diff --cached --quiet && exit 0
          git commit -m "Обновление фида $(TZ=Asia/Almaty date '+%Y-%m-%d %H:%M')"
          git push

      - name: Проверить остатки PP7
        run: |
          if [ -f pp7_error.txt ]; then cat pp7_error.txt; exit 1; fi
